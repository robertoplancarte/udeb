# compose.yml for ude, scaffolded by `neptuno init`.
#
# This file is yours: edit, add or remove services freely. Neptuno only
# appends a service here when you run `neptuno add <repo> <git-url>`.
name: ude

services:
  proxy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    # Containers reach these at the same URLs as the browser: locke reaches
    # Keycloak, so the issuer in its tokens matches, and Keycloak reaches
    # locke's SCIM API on the tenants' hosts. *.localhost would otherwise be
    # the container itself.
    networks:
      default:
        aliases: [keycloak.localhost, acme.localhost, globex.localhost]

  # Postgres 18 because Hook0's migrations use uuidv7(). initdb/ runs only
  # when the volume is empty, and creates the hook0 database.
  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - postgres_18:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 1s

  valkey:
    image: valkey/valkey:8
    ports: ["6379:6379"]
    volumes: ["valkey:/data"]

  s3:
    image: chrislusf/seaweedfs
    command: server -s3 -dir=/data
    ports: ["8333:8333"]
    volumes: ["s3:/data"]

  # Added by `neptuno add locke`
  locke:
    build: dockerfiles/locke
    working_dir: /app
    # caddy holds Caddy's local certificate authority, which entrypoint.sh
    # trusts so locke can reach https://keycloak.localhost.
    volumes: ["./repos/locke:/app", "./.neptuno/claude:/root/.claude", "locke_bundle:/usr/local/bundle", "locke_playwright:/root/.cache/ms-playwright", "caddy:/caddy:ro"]
    env_file: .neptuno/env/locke.env
    command: sleep infinity    # overmind execs the real processes
    depends_on: [postgres, valkey, s3, proxy, hook0-api, keycloak]

  # Keycloak at https://keycloak.localhost (admin/admin), standing in for the
  # identity providers locke's tenants bring: one realm per tenant, imported
  # from keycloak/realms on first start. locke's development seeds register
  # locke as a client in each, and point the realm's SCIM provisioning
  # (dockerfiles/keycloak) at locke. Realms persist in the keycloak volume;
  # delete it to import them again.
  keycloak:
    build: dockerfiles/keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: https://keycloak.localhost
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - keycloak:/opt/keycloak/data
      - ./keycloak/realms:/opt/keycloak/data/import:ro

  # Hook0 webhook server: an API, a worker that delivers the webhooks and a
  # dashboard at http://hook0.localhost (Caddy sends /api/ there to the API).
  # Hook0 publishes no up-to-date images, so these build from its repo at the
  # tag in hook0-api's build context (shared with the others as &hook0-src);
  # change it there to upgrade, then
  # docker compose build hook0-api hook0-output-worker hook0-frontend
  # Hook0 keeps its data in the shared postgres, in the hook0 database.
  # Repos get HOOK0_API_URL from _shared/base.env and HOOK0_API_KEY, which is
  # MASTER_API_KEY, from _shared/hook0.local.env (see scripts/before_up.sh). Sign-up emails land in Mailpit, at
  # http://mailpit.localhost.
  hook0-api:
    build:
      context: &hook0-src https://gitlab.com/hook0/hook0.git#frontend/v1.2.1
      dockerfile: api/Dockerfile
      args:
        FEATURES: application-secret-compatibility
    environment:
      IP: 0.0.0.0
      PORT: "8081"
      APP_URL: http://hook0.localhost
      CORS_ALLOWED_ORIGINS: http://hook0.localhost
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/hook0
      SMTP_CONNECTION_URL: smtp://mailpit:1025
      EMAIL_SENDER_ADDRESS: hook0@ude.localhost
    # BISCUIT_PRIVATE_KEY and MASTER_API_KEY, which scripts/before_up.sh
    # generates on each machine. Optional so compose still loads before the
    # first `neptuno up`.
    env_file:
      - path: environments/hook0/keys.local.env
        required: false
    depends_on:
      postgres: { condition: service_healthy }
      mailpit: { condition: service_started }

  hook0-output-worker:
    build:
      context: *hook0-src
      dockerfile: output-worker/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/hook0
      WORKER_NAME: default
      # Let webhooks reach the repos' containers, which have private IPs.
      DISABLE_TARGET_IP_CHECK: "true"
    # It exits if it starts before the API has migrated the database.
    restart: unless-stopped
    depends_on: [hook0-api]

  hook0-frontend:
    build:
      context: *hook0-src
      dockerfile: frontend/Dockerfile
    environment:
      API_ENDPOINT: http://hook0.localhost/api/v1
    depends_on: [hook0-api]

  mailpit:
    image: axllent/mailpit:v1.28
    ports: ["1025:1025", "8025:8025"]

volumes:
  caddy:
  postgres_18:
  valkey:
  s3:
  locke_bundle:
  locke_playwright:
  keycloak:
